<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="author" content="Rhonda Wille" />
  <title>City of Ann Arbor – Permitfinder Pro | Local Prototype</title>
  <style>
    :root{
      --navy:#061b45; --navy2:#08265b; --green:#078847; --green2:#0a9b53;
      --mint:#e9f8ef; --blue:#1d6fd7; --purple:#7658d6; --soft:#f6f9fc;
      --line:#dbe5f1; --text:#0a1e44; --muted:#596a83; --white:#fff;
      --warning:#fff8e7; --warning-line:#f2c94c; --danger:#a53636;
      --shadow:0 18px 48px rgba(8,38,91,.10);
      --shadow-soft:0 7px 22px rgba(8,38,91,.075);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color:var(--text); background:#f8fbff;
    }
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    a{color:#0d57c7;text-decoration:none}
    .shell{min-height:100vh;display:flex;flex-direction:column}
    .topbar{
      min-height:82px; background:rgba(255,255,255,.96); border-bottom:1px solid rgba(219,229,241,.72);
      display:flex; align-items:center; justify-content:space-between; gap:22px; padding:14px 32px;
      position:sticky; top:0; z-index:20; backdrop-filter:blur(10px);
    }
    .brand{display:flex;align-items:center;gap:14px}
    .seal{
      width:50px;height:50px;border:2px solid #1a2533;border-radius:999px;background:#fff;
      display:flex;align-items:center;justify-content:center;color:var(--green);font-weight:950;letter-spacing:-.04em;
      box-shadow:0 4px 12px rgba(0,0,0,.06);
    }
    .brand-title{font-size:28px;font-weight:850;letter-spacing:-.04em;color:var(--navy);white-space:nowrap}
    .brand-title span{color:var(--green)}
    .nav{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:flex-end}
    .nav button{border:0;background:transparent;color:var(--navy);font-weight:750;padding:8px 4px}
    .signin{
      border:1.4px solid var(--green)!important;color:var(--green)!important;border-radius:10px!important;
      padding:10px 17px!important;background:#fff!important;
    }
    .role-chip{border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:13px;color:var(--muted);font-weight:800;background:#fff}
    .main{flex:1}
    .hero{
      position:relative; min-height:390px; overflow:hidden;
      background:
        linear-gradient(90deg,rgba(255,255,255,.98) 0%,rgba(255,255,255,.88) 42%,rgba(255,255,255,.55) 100%),
        linear-gradient(180deg,#eff8ff 0%,#fff 92%);
      padding:56px 28px 42px;
    }
    .hero:before,.inner-hero:before{
      content:""; position:absolute; inset:0;
      background-image:url("data:image/svg+xml,%3Csvg width='1600' height='430' viewBox='0 0 1600 430' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='1600' height='430' fill='%23eaf6ff'/%3E%3Cpath d='M0 292 C180 266 280 310 440 286 C600 264 720 275 860 294 C1010 315 1188 270 1600 298 L1600 430 L0 430Z' fill='%23dcefdc' opacity='.72'/%3E%3Cpath d='M0 320 C240 302 370 338 520 318 C700 292 850 320 1034 330 C1260 342 1430 305 1600 320 L1600 430 L0 430Z' fill='%23eff8f4'/%3E%3Cg opacity='.30' fill='%23061b45'%3E%3Crect x='710' y='168' width='60' height='92' rx='2'/%3E%3Crect x='785' y='130' width='70' height='130' rx='2'/%3E%3Crect x='870' y='178' width='118' height='82' rx='2'/%3E%3Crect x='1020' y='118' width='54' height='142' rx='2'/%3E%3Crect x='1090' y='158' width='76' height='102' rx='2'/%3E%3Crect x='1190' y='90' width='50' height='170' rx='2'/%3E%3Cpath d='M1215 57 L1238 90 L1192 90Z'/%3E%3Crect x='1265' y='145' width='104' height='115' rx='2'/%3E%3Crect x='1392' y='120' width='86' height='140' rx='2'/%3E%3C/g%3E%3Cg opacity='.40' stroke='%23061b45' stroke-width='2' fill='none'%3E%3Cpath d='M1036 265 C1097 209 1192 209 1252 265'/%3E%3Cpath d='M1048 265 L1240 265'/%3E%3Cpath d='M1090 265 Q1120 209 1150 265'/%3E%3Cpath d='M1147 265 Q1178 209 1210 265'/%3E%3C/g%3E%3Cg fill='%23088747' opacity='.36'%3E%3Ccircle cx='610' cy='274' r='30'/%3E%3Ccircle cx='650' cy='266' r='38'/%3E%3Ccircle cx='700' cy='278' r='31'/%3E%3Ccircle cx='1320' cy='282' r='36'/%3E%3Ccircle cx='1368' cy='270' r='44'/%3E%3Ccircle cx='1420' cy='284' r='33'/%3E%3C/g%3E%3Cg fill='%23061b45' opacity='.17'%3E%3Cpath d='M0 350 C270 334 530 350 800 340 C1040 330 1280 357 1600 338 L1600 430 L0 430Z'/%3E%3C/g%3E%3C/svg%3E");
      background-size:cover;background-position:center;opacity:.96;
    }
    .hero-inner{position:relative;z-index:1;max-width:1160px;margin:0 auto;text-align:center}
    .headline{margin:0 auto;font-size:clamp(42px,5vw,62px);line-height:1.06;max-width:980px;letter-spacing:-.055em;color:var(--navy);font-weight:900}
    .subhead{color:var(--navy);font-size:20px;line-height:1.5;margin:18px auto 24px;max-width:820px}
    .search-wrap{
      margin:0 auto;width:min(780px,94%);height:72px;background:#fff;border:1px solid rgba(219,229,241,.95);
      border-radius:16px;box-shadow:var(--shadow);display:flex;align-items:center;padding:10px 12px 10px 24px;gap:16px;
    }
    .main-icon{font-size:34px;color:var(--navy)}
    .search-wrap input{border:0;outline:0;flex:1;font-size:18px;color:var(--navy)}
    .btn{
      border:0;border-radius:12px;padding:13px 20px;background:var(--green);color:#fff;font-weight:800;
      box-shadow:0 10px 24px rgba(7,136,71,.20);display:inline-flex;align-items:center;gap:8px;justify-content:center;
    }
    .btn:hover{background:#05783e}
    .btn.secondary{background:#fff;color:var(--green);border:1.4px solid var(--green);box-shadow:none}
    .btn.link{background:transparent;color:var(--navy);border:1px solid var(--line);box-shadow:none}
    .btn.danger{background:#fff;color:var(--danger);border:1px solid #efc9c9;box-shadow:none}
    .jurisdiction-pills{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
    .pill{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:11px 24px;font-weight:850;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-soft)}
    .pill.active{background:var(--green);color:#fff;border-color:var(--green)}
    .container{max-width:1280px;margin:0 auto;padding:38px 32px}
    .shortcut-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
    .shortcut{
      min-height:116px;border:1px solid var(--line);background:#fff;border-radius:16px;box-shadow:var(--shadow-soft);
      display:flex;align-items:center;gap:16px;padding:20px 18px;text-align:left;transition:.18s ease;
    }
    .shortcut:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#bdd9c9}
    .icon{width:58px;height:58px;min-width:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:31px;background:var(--mint);color:var(--green)}
    .icon.blue{background:#eaf2ff;color:var(--blue)}
    .icon.purple{background:#eee9ff;color:var(--purple)}
    .icon.yellow{background:#fff5d8;color:#9b6b03}
    .icon.teal{background:#e2f7f5;color:#087a7b}
    .shortcut h3{margin:0;font-size:17px;line-height:1.22;color:var(--navy);font-weight:900;letter-spacing:-.015em}
    .arrow{margin-left:auto;color:var(--green);font-size:26px}
    .steps{margin:34px auto 22px;display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:18px;align-items:center;max-width:790px;text-align:center}
    .step-connector{height:2px;border-top:2px dashed #b5c6df}
    .step-circle{display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--navy)}
    .badge{font-weight:900;background:#e7f6ed;color:var(--green);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center}
    .step-circle small{color:#596680;font-size:14px}
    .step-circle strong{font-size:16px}
    .trust-strip{margin:28px auto 0;max-width:900px;display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.78);overflow:hidden}
    .trust-item{display:flex;gap:10px;justify-content:center;align-items:center;padding:17px;color:var(--navy);font-weight:800}
    .trust-item + .trust-item{border-left:1px solid var(--line)}
    .check{color:var(--green);font-weight:900}
    .inner-hero{position:relative;padding:42px 32px 28px;background:linear-gradient(90deg,rgba(255,255,255,.98) 0%,rgba(255,255,255,.86) 45%,rgba(255,255,255,.58) 100%),linear-gradient(180deg,#eef8ff,#fff);overflow:hidden}
    .inner-hero:before{opacity:.55}
    .page-head{position:relative;z-index:1;max-width:1280px;margin:0 auto}
    .breadcrumb{display:flex;gap:10px;align-items:center;color:#0d57c7;font-weight:750;margin-bottom:24px;flex-wrap:wrap}
    .breadcrumb button{border:0;background:transparent;color:#0d57c7;font-weight:750;padding:0}
    .title-row{display:flex;justify-content:space-between;gap:24px;align-items:flex-end}
    .page-title{font-size:44px;line-height:1.05;margin:0 0 8px;color:var(--navy);letter-spacing:-.04em}
    .page-subtitle{margin:0;color:var(--muted);font-size:20px}
    .panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px;margin-top:28px}
    .panel-head{display:flex;gap:18px;align-items:flex-start;margin-bottom:20px}
    .panel-marker{width:50px;height:50px;border-radius:999px;background:#e7f6ed;color:var(--green);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px}
    .panel h2{margin:0 0 7px;color:var(--navy);font-size:24px;letter-spacing:-.02em}
    .panel p{margin:0;color:var(--muted);font-size:16px}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
    .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .question-list{display:grid;gap:10px}
    .choice-row{
      width:100%;display:flex;align-items:center;gap:16px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;
      min-height:58px;padding:13px 18px;box-shadow:0 5px 16px rgba(9,39,93,.055);color:var(--navy);font-weight:800
    }
    .choice-row:hover,.choice-row.featured{border-color:#3ab473;background:linear-gradient(90deg,#f5fff8,#fff)}
    .row-marker{width:36px;height:36px;border-radius:999px;background:#edf8f1;color:var(--green);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;min-width:36px}
    .info{color:#2e74ff;font-weight:900;border:1.3px solid #2e74ff;border-radius:50%;font-size:12px;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center}
    .chev{margin-left:auto;color:var(--green);font-size:24px}
    .progress{height:7px;background:#0d57c7;border-radius:999px;margin:18px 0 10px}
    .progress-label{color:var(--muted)}
    .results-card{display:grid;gap:10px;margin-top:24px}
    .result-row{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow-soft);padding:22px 24px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
    .result-row h3{margin:0 0 12px;color:var(--navy);font-size:21px}
    .actions{display:flex;gap:10px;flex-wrap:wrap}
    .tag{border-radius:999px;padding:6px 10px;background:#eef4ff;color:#0d57c7;font-weight:800;font-size:12px;display:inline-flex;margin:0 6px 6px 0}
    .tag.green{background:#e8f8ef;color:var(--green)}
    .tag.gray{background:#f0f3f7;color:#58677c}
    .tag.yellow{background:#fff4d7;color:#795400}
    .tag.red{background:#fff0f0;color:#9b2323}
    .field-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
    .field{display:flex;flex-direction:column;gap:7px}
    .field.full{grid-column:1/-1}
    label{font-weight:800;color:var(--navy);font-size:14px}
    input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:12px 13px;background:#fff;color:var(--navy);outline:none;min-height:44px}
    textarea{min-height:96px;resize:vertical}
    input:focus,select:focus,textarea:focus{border-color:#43b477;box-shadow:0 0 0 4px rgba(7,136,71,.10)}
    .lookup-card{border:1px solid var(--line);border-radius:14px;background:#f9fbfe;padding:16px;margin-top:14px;color:var(--navy)}
    .warn{background:#fff8e7;border-color:#fed56a;color:#513a00}
    .good{background:#f0fff5;border-color:#a4e6bd}
    .layout-2{display:grid;grid-template-columns:1.08fr .92fr;gap:24px}
    .hierarchy{display:grid;grid-template-columns:.85fr 1.15fr;gap:22px}
    .project-summary{position:sticky;top:104px;align-self:start}
    .meta{display:grid;gap:8px;margin-top:12px;color:var(--muted)}
    .meta b{color:var(--navy)}
    .app-card{border:1px solid var(--line);background:#fff;border-radius:16px;padding:18px;box-shadow:var(--shadow-soft);display:grid;gap:12px}
    .app-card + .app-card{margin-top:12px}
    .status{font-weight:900;color:var(--green)}
    .status.pending{color:#8a5c00}.status.hold{color:#a53636}.status.processing{color:#0d57c7}.status.complete{color:#078847}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
    .small{font-size:13px;color:var(--muted);line-height:1.45}
    .form-section{border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px;background:#fff}
    .draggable{cursor:grab}
    .dragging{opacity:.45}
    .drop-hint{border:1px dashed #77bd95;background:#f6fff9}
    .builder-row{display:grid;grid-template-columns:36px 1fr 150px 120px auto;gap:10px;align-items:center}
    .approval-row{display:grid;grid-template-columns:36px 1fr 160px 140px auto;gap:10px;align-items:center}
    .footer{background:linear-gradient(135deg,#061b45,#082a64);color:#fff;margin-top:auto;padding:26px 40px}
    .toast{position:fixed;right:24px;bottom:24px;background:var(--navy);color:#fff;border-radius:12px;padding:14px 18px;box-shadow:0 18px 45px rgba(0,0,0,.22);z-index:100;display:none}
    .modal-backdrop{position:fixed;inset:0;background:rgba(6,27,69,.28);display:none;align-items:center;justify-content:center;z-index:80;padding:18px}
    .modal{background:#fff;border-radius:18px;box-shadow:0 24px 80px rgba(0,0,0,.25);width:min(560px,100%);padding:26px;border:1px solid var(--line)}
    .modal h2{margin:0 0 10px;color:var(--navy)}

    .license-status-card{
      border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow-soft);
      padding:18px;display:grid;gap:10px
    }
    .license-status-card.valid{border-color:#9bdfb2;background:#f6fff9}
    .license-status-card.expired,.license-status-card.invalid{border-color:#efc9c9;background:#fff7f7}
    .license-status-card.warning{border-color:#f1c75b;background:#fffaf0}
    .license-status-title{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}
    .license-reminder-list{display:grid;gap:10px;margin-top:12px}
    .license-reminder{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;display:flex;justify-content:space-between;gap:12px;align-items:center}
    .license-reminder.sent{background:#f0fff5;border-color:#a4e6bd}
    .server-check-row{display:grid;grid-template-columns:1fr 180px;gap:12px;align-items:end}
    @media(max-width:850px){.server-check-row{grid-template-columns:1fr}}


    .seal img{width:100%;height:100%;object-fit:contain;padding:4px;display:block}
    .flow-builder{display:grid;grid-template-columns:.9fr 1.1fr;gap:18px;align-items:start}
    .flow-drop-zone{border:1px dashed #b8cfbf;border-radius:14px;background:#f7fff9;padding:12px;min-height:140px}
    .flow-drop-zone.active{background:#eefaf2;border-color:var(--green)}
    .result-helper{font-size:12px;color:var(--muted);line-height:1.45;margin-top:6px}
    .logo-preview{width:68px;height:68px;border:1px solid var(--line);border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-top:8px}
    .logo-preview img{width:100%;height:100%;object-fit:contain;padding:6px}
    @media(max-width:950px){.flow-builder{grid-template-columns:1fr}}


    .zone-preview{
      border:2px solid var(--line);border-radius:16px;background:#fff;box-shadow:var(--shadow-soft);
      padding:16px;margin-top:14px;display:grid;gap:8px
    }
    .zone-preview-head{display:flex;gap:12px;align-items:center}
    .zone-icon{
      width:44px;height:44px;border-radius:14px;background:#f5fff8;display:flex;align-items:center;justify-content:center;
      font-size:24px;font-weight:900;color:var(--green);border:1px solid #d8ecdf;overflow:hidden
    }
    .zone-icon img{width:100%;height:100%;object-fit:contain;display:block;padding:6px}

    .home-zone-icon{
      width:59px;height:59px;min-width:59px;
      display:flex;align-items:center;justify-content:center;
      font-size:40px;font-weight:950;line-height:1;
      background:transparent;border:0;border-radius:0;box-shadow:none;overflow:visible;
    }
    .home-zone-icon img{
      width:59px;height:59px;object-fit:contain;display:block;padding:0;border:0;background:transparent;
    }

    .icon-upload-note{font-size:12px;color:var(--muted);line-height:1.45;margin-top:6px}
    .zone-order-help{border:1px dashed #b8cfbf;background:#f7fff9;color:var(--navy);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:750;margin-top:12px}
    .color-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    input[type="color"]{padding:2px;width:54px;height:44px}


    .reference-controls{display:grid;grid-template-columns:220px 1fr auto;gap:12px;align-items:end}
    .reference-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:18px}
    .reference-card{border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:var(--shadow-soft);padding:18px;display:grid;gap:10px}
    .reference-card h3{margin:0;color:var(--navy);font-size:18px}
    .reference-meta{color:var(--muted);font-size:13px;line-height:1.45}
    .metric-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
    .metric-card{border:1px solid var(--line);background:#fff;border-radius:16px;box-shadow:var(--shadow-soft);padding:16px;text-align:left;color:var(--navy)}
    .metric-card:hover,.metric-card.active{border-color:var(--green);background:#f5fff8;transform:translateY(-1px)}
    .metric-card strong{display:block;font-size:28px;letter-spacing:-.04em;color:var(--navy);margin-top:6px}
    .metric-card span{font-size:13px;font-weight:850;color:var(--muted)}
    .split-screen{display:grid;grid-template-columns:360px 1fr;gap:18px;align-items:start}
    .drill-list{display:grid;gap:10px}
    .processor-card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px;box-shadow:var(--shadow-soft);text-align:left}
    .processor-card.active,.processor-card:hover{border-color:var(--green);background:#f5fff8}
    .kpi-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
    .kpi-mini div{border:1px solid var(--line);border-radius:10px;padding:8px;background:#f8fbff;text-align:center}
    .kpi-mini b{display:block;color:var(--navy)}
    .dashboard-subnav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
    @media(max-width:950px){.split-screen,.reference-controls{grid-template-columns:1fr}}


    .right-status{margin-left:auto;min-width:180px;text-align:right;display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
    .app-card-head{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start}
    .app-card-status{text-align:right;min-width:150px}
    .package-intro{border:1px solid var(--line);border-radius:16px;background:#fff;padding:18px;box-shadow:var(--shadow-soft);margin-bottom:18px}

    .communications-list{display:grid;gap:10px;margin-top:14px}
    .communication-item{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px}
    .communication-meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;font-weight:800;margin-bottom:6px}
    .audit-list{display:grid;gap:8px;margin-top:12px}
    .audit-item{border-left:3px solid var(--green);background:#f8fbff;border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
    .edit-pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900;color:var(--green)}

    .status-line{
      display:inline-flex;align-items:center;gap:8px;justify-content:flex-end;

function ensureAdminConfig(){
  const defaults = defaultAdminConfig();
  state.adminConfig = state.adminConfig || defaults;
  state.adminConfig.zones = state.adminConfig.zones || defaults.zones;
  state.adminConfig.zones.forEach((z,i) => {
    const d = defaults.zones.find(x => x.id === z.id) || defaults.zones[i] || {};
    if(!z.order) z.order = i + 1;
    if(!z.shortDescription) z.shortDescription = d.shortDescription || z.menuLabel || z.label || '';
    if(!z.longDescription) z.longDescription = d.longDescription || z.shortDescription || '';
    if(!z.icon) z.icon = d.icon || '•';
    if(z.iconImageDataUrl == null) z.iconImageDataUrl = d.iconImageDataUrl || '';
    if(!z.color) z.color = d.color || '#078847';
    if(!z.startQuestionId && d.startQuestionId) z.startQuestionId = d.startQuestionId;
  });
  state.adminConfig.questions = state.adminConfig.questions || defaults.questions;
  state.adminConfig.questions.forEach(q => { if(q.showInfoIcon == null) q.showInfoIcon = !!q.moreInfo; });
  normalizeAnswerResultForms();
  state.adminConfig.branding = {...defaults.branding, ...(state.adminConfig.branding || {})}; if(state.adminConfig.branding.logoImageDataUrl == null) state.adminConfig.branding.logoImageDataUrl=''; if(state.adminConfig.branding.logoFileName == null) state.adminConfig.branding.logoFileName='';
  state.adminConfig.systemAudit = state.adminConfig.systemAudit || [];
  state.adminConfig.license = {...defaults.license, ...(state.adminConfig.license || {})};
  state.adminConfig.automaticUpdates = {...(defaults.automaticUpdates || {}), ...(state.adminConfig.automaticUpdates || {})};
  state.adminConfig.departments = (state.adminConfig.departments || defaults.departments || []).map((d,i)=>({
    id:d.id || uid('DEPT'),
    name:d.name || `Department ${i+1}`,
    mailingAddress:d.mailingAddress || '',
    physicalLocation:d.physicalLocation || '',
    phone:d.phone || '',
    generalEmail:d.generalEmail || '',
    processingEmailSame:d.processingEmailSame !== false,
    processingEmail:d.processingEmail || d.generalEmail || '',
    hours:d.hours || ''
  })).sort((a,b)=>a.name.localeCompare(b.name));
  state.adminConfig.prerequisites = [...new Set([...(defaults.prerequisites || []), ...((state.adminConfig.prerequisites || []))])].sort((a,b)=>a.localeCompare(b));
  state.adminConfig.importedApplications = state.adminConfig.importedApplications || {};
  state.adminConfig.lastWorkbookImport = state.adminConfig.lastWorkbookImport || null;
  registerImportedApplications();
  return state.adminConfig;
}

function safeKey(value, prefix='importedApp'){
  const raw = String(value ?? '').trim() || uid(prefix);
  return prefix + '_' + raw.replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
}
function normalizeQuestionId(value){
  const raw = String(value ?? '').trim();
  if(!raw) return '';
  return raw.startsWith('Q-') ? raw : 'Q-' + raw.replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
}
function normalizeZoneId(value){
  const raw = String(value ?? '').trim();
  if(!raw) return uid('ZONE');
  return raw.startsWith('ZONE-') ? raw : 'ZONE-' + raw.replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
}
function getCell(row, names, fallback=''){
  for(const name of names){
    if(row && Object.prototype.hasOwnProperty.call(row, name) && row[name] !== null && row[name] !== undefined && String(row[name]).trim() !== '') return row[name];
  }
  return fallback;
}
function splitList(value){
  return String(value || '').split(/[;\n]+|,(?=\s*[A-Za-z])/).map(x=>x.trim()).filter(Boolean);
}
function parseFee(value){
  if(value === null || value === undefined) return 0;
  if(typeof value === 'number') return value;
  const s = String(value).toLowerCase();
  if(!s || s.includes('no separate') || s.includes('no flat') || s.includes('varies')) return 0;
  const m = s.replace(/,/g,'').match(/\$?\s*(\d+(?:\.\d{1,2})?)/);
  return m ? Number(m[1]) : 0;
}
function registerImportedApplications(){
  const cfg = state?.adminConfig;
  if(!cfg || !cfg.importedApplications) return;
  Object.entries(cfg.importedApplications).forEach(([key, app]) => {
    APPLICATION_CATALOG[key] = {...(APPLICATION_CATALOG[key] || {}), ...app};
  });
}
function jurisdictionFromDepartment(dept=''){
  const d = String(dept).toLowerCase();
  if(d.includes('county') || d.includes('dade') || d.includes('washtenaw')) return 'County';
  if(d.includes('state') || d.includes('michigan') || d.includes('florida')) return 'State';
  return 'City';
}

function importProfileWorkbook(){
  const input = byId('profileWorkbookFile');
  const status = byId('workbookImportStatus');
  const replace = byId('profileReplaceExisting')?.checked !== false;
  if(!input || !input.files || !input.files[0]){ toast('Choose a workbook first.'); return; }
  if(!window.XLSX){
    status.innerHTML = '<b>Workbook parser not loaded.</b><br>The prototype uses the SheetJS XLSX parser from CDN. Connect to the internet or bundle xlsx.full.min.js locally.';
    return;
  }
  const file = input.files[0];
  const reader = new FileReader();
  status.textContent = 'Reading workbook...';
  reader.onload = function(e){
    try{
      const bytes = new Uint8Array(e.target.result);
      const workbook = XLSX.read(bytes, {type:'array'});
      const rows = (name) => workbook.Sheets[name] ? XLSX.utils.sheet_to_json(workbook.Sheets[name], {defval:''}) : [];
      const result = populateSystemFromWorkbook({
        forms: rows('Forms & Permits'),
        departments: rows('Department Contacts'),
        zones: rows('Information Zones'),
        questions: rows('Questions'),
        answers: rows('Answers')
      }, {replace, fileName:file.name});
      status.innerHTML = `<b>Import complete.</b><br>${result.applications} applications, ${result.departments} departments, ${result.zones} zones, ${result.questions} questions, and ${result.answers} answers loaded.`;
      saveState();
      render();
      toast('Workbook imported successfully.');
    } catch(err){
      console.error(err);
      status.innerHTML = `<b>Import failed.</b><br>${esc(err.message || String(err))}`;
    }
  };
  reader.readAsArrayBuffer(file);
}
function populateSystemFromWorkbook(data, options={}){
  const cfg = ensureAdminConfig();
  const replace = options.replace !== false;
  const importedApplications = {};
  const formTemplates = [];
  const departmentMap = new Map();
  const prerequisiteSet = new Set(cfg.prerequisites || []);

  (data.departments || []).forEach((row, i) => {
    const name = String(getCell(row, ['Department name','Department','Department / Office'])).trim();
    if(!name) return;
    const email = String(getCell(row, ['Email','General Email','General questions email'])).trim();
    const address = String(getCell(row, ['Address / contact information','Address','Mailing address'])).trim();
    departmentMap.set(name, {
      id:safeKey(name, 'DEPT'), name,
      mailingAddress:address,
      physicalLocation:address,
      phone:String(getCell(row, ['Phone number','Phone'])).trim(),
      generalEmail:email,
      processingEmailSame:true,
      processingEmail:email,
      website:String(getCell(row, ['Website address','Website','URL'])).trim(),
      hours:String(getCell(row, ['Hours of operation','Hours'])).trim()
    });
  });

  (data.forms || []).forEach((row, i) => {
    const id = getCell(row, ['Application ID','ID'], i+1);
    const name = String(getCell(row, ['Name / Type','Name','Application Name'])).trim();
    if(!name) return;
    const key = importedAppKeyByWorkbookId(id);
    const department = String(getCell(row, ['Department / Office','Department','Department name'])).trim() || 'Imported Department';
    const url = String(getCell(row, ['PDF / Download Link','URL','Link'])).trim();
    const formType = String(getCell(row, ['Form Type','Type'])).trim();
    const category = String(getCell(row, ['Category','Zone','Zone Name'])).trim() || 'Imported';
    const purpose = String(getCell(row, ['Purpose / When Required','Purpose','Description'])).trim();
    const prereqs = splitList(getCell(row, ['Prerequisites / Submission Requirements','Prerequisites','Submission Requirements']));
    prereqs.forEach(p=>prerequisiteSet.add(p));
    const fee = parseFee(getCell(row, ['Form Fee','Fee','Application Fee']));
    const isExternal = !!url || /pdf|download|external|checklist|guidance/i.test(formType);
    importedApplications[key] = {
      name, jurisdiction:jurisdictionFromDepartment(department), department,
      type:isExternal ? 'external' : 'online', category, url,
      requiresTaxLot:/building|permit|construction|property|site|zoning|flood|right-of-way|right of way/i.test(`${category} ${purpose}`),
      fee,
      sourceWorkbookId:String(id),
      purpose,
      notes:String(getCell(row, ['Notes / Comments','Notes','Comments'])).trim(),
      keywords:String(getCell(row, ['Keyword Search Tags','Keywords','Tags'])).trim()
    };
    if(!departmentMap.has(department)){
      departmentMap.set(department, {id:safeKey(department,'DEPT'), name:department, mailingAddress:'', physicalLocation:'', phone:'', generalEmail:'', processingEmailSame:true, processingEmail:'', website:'', hours:''});
    }
    formTemplates.push({
      id:'TPL-' + key,
      applicationKey:key,
      name,
      category,
      department,
      status:'Active',
      includeCommon:true,
      fields: sampleFieldsFor(key),
      approvalMode:'Serial',
      paymentTiming: fee > 0 ? 'At submission' : 'No payment required',
      fee,
      prerequisites: prereqs.sort((a,b)=>a.localeCompare(b)),
      approvalFlow:[{id:uid('APR'), department, role:'Department Processor', order:1, status:'Pending approval'}]
    });
  });

  const zones = (data.zones || []).map((row, i) => {
    const zid = normalizeZoneId(getCell(row, ['Zone ID','ID'], i+1));
    const name = String(getCell(row, ['Zone Name','Name','Menu label'])).trim() || `Zone ${i+1}`;
    const desc = String(getCell(row, ['Zone Description','Description'])).trim();
    const categories = String(getCell(row, ['Categories Covered','Categories'])).trim();
    return {
      id:zid, label:name, menuLabel:name,
      shortDescription:desc || categories || name,
      longDescription: categories ? `${desc}\n\nCategories covered: ${categories}` : desc,
      startQuestionId:normalizeQuestionId(getCell(row, ['Entry Question ID','Start Question ID','Question ID'])),
      order:i+1,
      icon:String(getCell(row, ['Custom Icon','Icon'], '•')).trim() || '•',
      iconImageDataUrl:'', iconFileName:'', color:['#078847','#1d6fd7','#7658d6','#b77900','#087a7b','#7048e8','#0f766e','#be123c'][i % 8]
    };
  }).filter(z=>z.menuLabel && !/^zone\s*$/i.test(z.menuLabel));

  const questions = (data.questions || []).map((row, i) => ({
    id:normalizeQuestionId(getCell(row, ['Question ID','ID'], i+1)),
    order:i+1,
    zoneId:'',
    text:String(getCell(row, ['Question Text','Text','Question'])).trim(),
    moreInfo:String(getCell(row, ['Info Icon Text','More info','Info'])).trim(),
    isMultiSelect:String(getCell(row, ['Is Multi-Select','Multi Select','MultiSelect'])).trim() === '1',
    answers:[]
  })).filter(q=>q.text);
  zones.forEach(z => {
    const q = questions.find(item => item.id === z.startQuestionId);
    if(q) q.zoneId = z.id;
  });
  // Assign remaining questions to the first zone when workbook does not explicitly provide a zone.
  questions.forEach(q => { if(!q.zoneId) q.zoneId = zones.find(z=>z.startQuestionId===q.id)?.id || zones[0]?.id || ''; });

  const questionMap = new Map(questions.map(q=>[q.id,q]));
  let answerCount = 0;
  (data.answers || []).forEach((row, i) => {
    const qid = normalizeQuestionId(getCell(row, ['Question ID','Question IID']));
    const q = questionMap.get(qid);
    if(!q) return;
    const nextQ = normalizeQuestionId(getCell(row, ['Next Question IID','Next Question ID','Next Question']));
    const singleApp = getCell(row, ['Resulting Application ID','Application ID']);
    const csvApps = String(getCell(row, ['Resulting Application IDs (CSV)','Resulting Application IDs','Application IDs'])).trim();
    const appIds = (csvApps ? csvApps.split(',') : (singleApp ? [singleApp] : [])).map(x=>String(x).trim()).filter(Boolean).map(importedAppKeyByWorkbookId);
    let resultType = 'statement';
    let target = String(getCell(row, ['Info Icon Text','Statement','Result'])).trim();
    if(nextQ){ resultType='nextQuestion'; target=nextQ; }
    else if(appIds.length){ resultType='fillableForm'; target=appIds.join(','); }
    q.answers = q.answers || [];
    q.answers.push({
      id:safeKey(getCell(row, ['Answer ID','ID'], i+1), 'ANS'),
      text:String(getCell(row, ['Answer Text','Answer'])).trim(),
      moreInfo:String(getCell(row, ['Info Icon Text','More info','Info'])).trim(),
      resultType,
      target,
      formKeys: appIds
    });
    answerCount += 1;
  });

  if(replace){
    cfg.importedApplications = importedApplications;
    state.formTemplates = formTemplates;
    cfg.departments = Array.from(departmentMap.values()).sort((a,b)=>a.name.localeCompare(b.name));
    cfg.zones = zones.length ? zones : cfg.zones;
    cfg.questions = questions.length ? questions : cfg.questions;
  } else {
    cfg.importedApplications = {...(cfg.importedApplications || {}), ...importedApplications};
    const byTemplateKey = new Map(state.formTemplates.map(t=>[t.applicationKey,t]));
    formTemplates.forEach(t=>byTemplateKey.set(t.applicationKey,t));
    state.formTemplates = Array.from(byTemplateKey.values()).sort((a,b)=>a.name.localeCompare(b.name));
    const byDept = new Map((cfg.departments || []).map(d=>[d.name,d]));
    departmentMap.forEach((d,name)=>byDept.set(name,d));
    cfg.departments = Array.from(byDept.values()).sort((a,b)=>a.name.localeCompare(b.name));
    const byZone = new Map((cfg.zones || []).map(z=>[z.id,z])); zones.forEach(z=>byZone.set(z.id,z)); cfg.zones = Array.from(byZone.values()).sort((a,b)=>(a.order||0)-(b.order||0));
    const byQuestion = new Map((cfg.questions || []).map(q=>[q.id,q])); questions.forEach(q=>byQuestion.set(q.id,q)); cfg.questions = Array.from(byQuestion.values()).sort((a,b)=>(a.order||0)-(b.order||0));
  }
  cfg.prerequisites = Array.from(prerequisiteSet).sort((a,b)=>a.localeCompare(b));
  registerImportedApplications();
  const summary = {applications:Object.keys(importedApplications).length, departments:departmentMap.size, zones:zones.length, questions:questions.length, answers:answerCount, fileName:options.fileName || '', at:new Date().toISOString()};

  return summary;
}

function normalizeProjectData(data){
  data.adminConfig = data.adminConfig || defaultAdminConfig();

  data.adminConfig.questions.forEach(q => { if(q.showInfoIcon == null) q.showInfoIcon = !!q.moreInfo; });
  (data.adminConfig.questions || []).forEach(q => (q.answers || []).forEach(ans => { if(ans.resultType === 'fillableForm'){ ans.formKeys = Array.isArray(ans.formKeys) ? ans.formKeys : String(ans.target || '').split(/[,\\n;|]+/).map(x=>x.trim()).filter(Boolean); if(ans.formKeys.length) ans.target = ans.formKeys.join(','); } else if(!Array.isArray(ans.formKeys)) ans.formKeys = []; }));
  data.adminConfig.branding = {...defaultAdminConfig().branding, ...(data.adminConfig.branding || {})}; if(data.adminConfig.branding.logoImageDataUrl == null) data.adminConfig.branding.logoImageDataUrl=''; if(data.adminConfig.branding.logoFileName == null) data.adminConfig.branding.logoFileName='';
  data.adminConfig.systemAudit = data.adminConfig.systemAudit || [];
  data.adminConfig.license = {...defaultAdminConfig().license, ...(data.adminConfig.license || {})};
  data.adminConfig.automaticUpdates = {...(defaultAdminConfig().automaticUpdates || {}), ...(data.adminConfig.automaticUpdates || {})};
  data.adminConfig.departments = data.adminConfig.departments || defaultAdminConfig().departments;
  data.adminConfig.departments = data.adminConfig.departments.map((d,i)=>({
    id:d.id || uid('DEPT'),
    name:d.name || `Department ${i+1}`,
    mailingAddress:d.mailingAddress || '',
    physicalLocation:d.physicalLocation || '',
    phone:d.phone || '',
    generalEmail:d.generalEmail || '',
    processingEmailSame:d.processingEmailSame !== false,
    processingEmail:d.processingEmail || d.generalEmail || '',
    hours:d.hours || ''
  })).sort((a,b)=>a.name.localeCompare(b.name));
  data.adminConfig.prerequisites = [...new Set([...(defaultAdminConfig().prerequisites || []), ...((data.adminConfig.prerequisites || []))])].sort((a,b)=>a.localeCompare(b));
  data.adminConfig.importedApplications = data.adminConfig.importedApplications || {};
  data.adminConfig.lastWorkbookImport = data.adminConfig.lastWorkbookImport || null;
  data.formTemplates = data.formTemplates || defaultTemplates();
  data.formTemplates.forEach(t => { t.status = normalizeTemplateStatus(t.status); });
  data.projects = data.projects || [];
  data.projects.forEach(p => {
    p.auditTrail = p.auditTrail || [];
    p.communications = p.communications || [];
    p.notifications = p.notifications || [];
    (p.applications || []).forEach(a => {
      a.auditTrail = a.auditTrail || [];
      a.comments = a.comments || [];
      a.notifications = a.notifications || [];
      a.packageFormId = a.packageFormId || a.id;
      a.profileKey = a.profileKey || `${p.id}::${a.id}`;
      a.statusHistory = a.statusHistory || [];
      if(!a.paymentTiming) a.paymentTiming = defaultPaymentTimingFor(a.catalogId);
      if(!a.paymentStatus) a.paymentStatus = a.status === 'Pending payment' ? 'Due' : 'Not due';
      if(!a.paymentMethod) a.paymentMethod = '';
      if(!a.paymentReceipt) a.paymentReceipt = '';
    });
  });
  return data;
}

  const entry = { id:uid('AUD'), at:new Date().toISOString(), by:actorName(), applicationId:appItem?.id || '', applicationName:appItem?.name || '', action, detail };
  project.auditTrail = project.auditTrail || [];
  project.auditTrail.unshift(entry);

    appItem.auditTrail.unshift(entry);

}
function addProjectCommunication(project, message, appItem=null, visibility='User and staff'){
  if(!message || !message.trim()) return null;
  const item = { id:uid('COM'), at:new Date().toISOString(), from:actorName(), applicationId:appItem?.id || '', applicationName:appItem?.name || '', message:message.trim(), visibility };
  project.communications = project.communications || [];
  project.communications.unshift(item);
  if(appItem){
    appItem.comments = appItem.comments || [];
    appItem.comments.unshift(item);
  }
  addAudit(project, appItem, 'Correspondence added', message.trim());
  addNotification(project, `New correspondence was added${appItem ? ' for ' + appItem.name : ''}.`, appItem?.id || '');
  return item;
}
function addNotification(project, message, appId=''){
  project.notifications = project.notifications || [];
  project.notifications.unshift({ id:uid('NOT'), at:new Date().toISOString(), message, applicationId:appId, read:false });

function compareAndAudit(project, appItem, beforeObj, afterObj, label){
  const keys = new Set([...Object.keys(beforeObj || {}), ...Object.keys(afterObj || {})]);
  keys.forEach(k => {
    const before = beforeObj?.[k] || '';
    const after = afterObj?.[k] || '';
    if(String(before) !== String(after)){
      addAudit(project, appItem, 'Field updated', `${label}.${k}: "${before}" changed to "${after}"`);
      addNotification(project, `${actorName()} updated ${label}.${k} on ${appItem.name}.`, appItem.id);
    }
  });
}

      parsed.formTemplates.forEach(t => { t.status = normalizeTemplateStatus(t.status); if(!t.paymentTiming) t.paymentTiming = defaultPaymentTimingFor(t.applicationKey); if(t.fee == null) t.fee = defaultApplicationFeeFor(t.applicationKey); if(!t.prerequisites) t.prerequisites = defaultPrerequisitesFor(t.applicationKey); });

function readCommon(prefix){
  return {
    applicantName: byId(prefix + '_applicantName')?.value.trim() || '',
    email: byId(prefix + '_email')?.value.trim() || '',
    phone: byId(prefix + '_phone')?.value.trim() || '',
    mailingAddress: byId(prefix + '_mailingAddress')?.value.trim() || '',
    projectName: byId(prefix + '_projectName')?.value.trim() || '',
    taxLot: byId(prefix + '_taxLot')?.value.trim() || ''
  };
}
function validateCommon(common, needsTaxLot=false){
  const missing=[];
  if(!common.applicantName) missing.push('applicant name');
  if(!common.mailingAddress) missing.push('mailing address');
  if(!common.phone) missing.push('phone');
  if(!common.email) missing.push('email');
  if(needsTaxLot && !common.taxLot) missing.push('property tax lot number');
  if(missing.length){ toast('Missing: ' + missing.join(', ')); return false; }
  return true;
}
function lookupTaxLot(query){
  const q = String(query||'').trim().toLowerCase();
  return state.propertyLookup.find(row => String(row.taxLot||'').toLowerCase()===q || String(row.address||'').toLowerCase().includes(q));
}
function updateTaxLotLookup(){
  const taxLot = byId('projectCommon_taxLot')?.value.trim();
  const lookup = lookupTaxLot(taxLot);
  const status = byId('lookupStatus');
  const preview = byId('floodplainPreview');
  if(!taxLot){ status.className='lookup-card'; status.innerHTML='Enter a property tax lot number to check floodplain and permitted-use data.'; preview.innerHTML=''; return; }
  if(!lookup){ status.className='lookup-card warn'; status.innerHTML='<b>No property lookup match found.</b><br><span class="small">Confirm with staff or ask an Administrator to import updated lookup data.</span>'; preview.innerHTML=''; return; }
  const inFloodplain = isFloodplain(lookup);
  status.className = 'lookup-card ' + (inFloodplain ? 'warn' : 'good');
  status.innerHTML = `<b>${esc(lookup.address || 'Property found')}</b><br>Floodplain: <b>${inFloodplain ? 'Yes — Floodplain permit will be added' : 'No'}</b><br>Permitted use: <b>${esc(lookup.permittedUse || 'Not provided')}</b>`;
  preview.innerHTML = inFloodplain ? miniAppLine('floodplain', defaultAppsForCategory(route.params.category).length + 1) : '';
}
function isFloodplain(row){ return String(row.floodplain).toLowerCase().startsWith('y') || String(row.floodplain).toLowerCase()==='true'; }
function defaultAppsForCategory(category){
  if(category==='building') return ['buildingPermit'];
  if(category==='property') return ['planningLandUse'];
  if(category==='publicWorks') return ['drivewayRoad'];
  if(category==='events') return ['specialEvent'];
  if(category==='personal') return ['personalLicense'];
  return ['cityBusinessLicense'];
}
function miniAppLine(id,num=1){

function saveProjectFromIntake(category){
  const needsTaxLot = ['building','property','publicWorks'].includes(category);
  const common = readCommon('projectCommon');
  if(!validateCommon(common,needsTaxLot)) return;
  if(needsTaxLot && !byId('permittedUseConfirmed').checked){ toast('Please review and confirm the permitted-use check before saving.'); return; }
  const applicationIds = defaultAppsForCategory(category);
  const lookup = lookupTaxLot(common.taxLot);
  if(lookup && isFloodplain(lookup) && !applicationIds.includes('floodplain')) applicationIds.push('floodplain');
  const project = makeProject({
    category: route.params.categoryLabel || category, pathway: route.params.categoryLabel || category, common,
    description: byId('projectDescription')?.value.trim() || '', propertyLookup: lookup || null, applicationIds
  });
  go('package',{projectId:project.id});
}
function makeProject({category,pathway,common,description,propertyLookup=null,applicationIds=[]}){
  const projectId = uniqueId('PFP');
  const now = new Date().toISOString();
  const uniqueApplicationIds = [...new Set(applicationIds)].filter(Boolean).filter(catId => { const t = templateFor(catId); return !t || isTemplateActive(t); });
  const applications = uniqueApplicationIds.map((catId,idx)=>{
    const tpl = templateFor(catId);
    const base = APPLICATION_CATALOG[catId] || {
      name: tpl?.name || catId,
      department: tpl?.department || 'Imported Department',
      jurisdiction: jurisdictionFromDepartment(tpl?.department || ''),
      type: 'online',
      url: '',
      category: tpl?.category || 'Imported'
    };
    return {
      id:`${projectId}-APP-${String(idx+1).padStart(2,'0')}`, catalogId:catId, templateId:tpl?.id || '',
      parentProjectId:projectId, name:base.name, department:base.department, jurisdiction:base.jurisdiction,
      type:base.type, url:base.url || '', status:'Submitted',
      common:{...common}, formData:{}, approvalMode:tpl?.approvalMode || 'Serial',
      paymentTiming: tpl?.paymentTiming || defaultPaymentTimingFor(catId),
      fee: tpl?.fee ?? feeForApplicationKey(catId),
      prerequisites: (tpl?.prerequisites || defaultPrerequisitesFor(catId)).slice().sort((a,b)=>a.localeCompare(b)),
      paymentStatus: 'Not due',
      paymentMethod: '',
      paymentReceipt: '',
      comments: [], auditTrail: [], notifications: [],
      packageFormId:`${projectId}-FORM-${String(idx+1).padStart(2,'0')}`,
      profileKey:`${common.email || common.applicantName || 'public-user'}::${projectId}::${catId}`,
      statusHistory:[],
      approvalSteps:(tpl?.approvalFlow || defaultApprovalFor(catId)).map((s,i)=>({...s, order:i+1, status:'Pending approval'})),
      submittedAt:null
    };
  });
  const project = {id:projectId, createdAt:now, updatedAt:now, category,pathway,description,common,propertyLookup,children:applications.map(a=>a.id),applications, communications:[], auditTrail:[], notifications:[]};
  project.applications.forEach(appItem => initializePackageFormStatus(project, appItem, appItem.status || 'Submitted'));
  state.projects.unshift(project); saveState(); toast(`Saved ${projectId}`); return project;
}
function templateFor(applicationKey){ return state.formTemplates.find(t=>t.applicationKey===applicationKey) || null; }
function findProject(projectId){ return state.projects.find(p=>p.id===projectId); }
function findApp(appId){
  for(const p of state.projects){ const a=p.applications.find(x=>x.id===appId); if(a) return {project:p, app:a}; }
  return {};
}

function isPaymentDue(appItem){
  return !!appItem && (appItem.status === 'Pending payment' || appItem.paymentStatus === 'Due');
}
function paymentDueHtml(appItem){
  if(!isPaymentDue(appItem)) return '';
  return `<div class="payment-note">
    <div><b>Payment required</b><div class="small">Payment is due: ${esc(appItem.paymentTiming || defaultPaymentTimingFor(appItem.catalogId))}. Choose an online or in-person payment option.</div>${appItem.paymentMethod ? `<div class="payment-receipt">Selected method: ${esc(appItem.paymentMethod)} ${appItem.paymentReceipt ? '· Receipt: ' + esc(appItem.paymentReceipt) : ''}</div>` : ''}</div>
    <button class="btn" onclick="openPaymentModal('${appItem.id}')">Pay online</button>
  </div>`;
}
function evaluatePaymentDue(appItem, eventName){
  if(!appItem) return;
  const timing = appItem.paymentTiming || defaultPaymentTimingFor(appItem.catalogId);
  if(timing === 'No payment required'){
    appItem.paymentStatus = appItem.paymentStatus || 'Not due';
    return;
  }
  if(eventName === 'submission' && timing === 'At submission'){
    appItem.status = 'Pending payment';
    appItem.paymentStatus = 'Due';
  }
  if(eventName === 'approval' && timing === 'Upon approval'){
    appItem.status = 'Pending payment';
    appItem.paymentStatus = 'Due';
  }
  if(eventName === 'statusUpdate' && timing === 'Upon issued' && appItem.status === 'Completed'){
    appItem.status = 'Pending payment';
    appItem.paymentStatus = 'Due';
  }
}
function openPaymentModal(appId){
  const found = findApp(appId);
  if(!found.app) return;
  let modal = byId('paymentModal');
  if(!modal){
    modal = document.createElement('div');
    modal.id = 'paymentModal';
    modal.className = 'modal-backdrop';
    document.body.appendChild(modal);
  }
  const methods = ['Venmo','Zelle','PayPal','Electronic check','Credit / debit card','Cash in person'];
  modal.innerHTML = `<div class="modal">
    <h2>Payment required</h2>
    <p class="small">${esc(found.app.name)}<br>${esc(found.project.id)} · ${esc(found.app.department)}</p>
    <div class="payment-method-grid">
      ${methods.map(m=>`<button type="button" class="payment-method" onclick="selectPaymentMethod(this,'${m}')">${m}</button>`).join('')}
    </div>
    <div class="field" style="margin-top:14px">
      <label for="paymentNote">Reference / notes</label>
      <input id="paymentNote" placeholder="Optional transaction reference" />
    </div>
    <div class="toolbar">
      <button class="btn" onclick="completePayment('${appId}')">Record payment</button>
      <button class="btn secondary" onclick="closePaymentModal()">Cancel</button>
    </div>
  </div>`;
  modal.style.display='flex';
}
function selectPaymentMethod(btn, method){
  document.querySelectorAll('#paymentModal .payment-method').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  btn.closest('.modal').dataset.method = method;
}
function closePaymentModal(){
  const modal = byId('paymentModal');
  if(modal) modal.style.display='none';
}
function completePayment(appId){
  const found = findApp(appId);
  if(!found.app) return;
  const modal = byId('paymentModal');
  const method = modal?.querySelector('.modal')?.dataset.method || 'Electronic check';
  const note = byId('paymentNote')?.value.trim() || '';
  found.app.paymentMethod = method;
  found.app.paymentReceipt = note || ('PAY-' + Date.now().toString().slice(-6));
  found.app.paymentStatus = 'Paid';
  if(found.app.status === 'Pending payment'){
    if(found.app.paymentTiming === 'At submission') setPackageFormStatus(found.project, found.app, 'Pending approval', 'Payment recorded');
    else if(found.app.paymentTiming === 'Upon approval') setPackageFormStatus(found.project, found.app, 'Processing', 'Payment recorded');
    else setPackageFormStatus(found.project, found.app, 'Completed', 'Payment recorded');
  }
  addAudit(found.project, found.app, 'Payment recorded', `${method} · ${found.app.paymentReceipt}`);
  addNotification(found.project, `${found.app.name} payment was recorded using ${method}.`, found.app.id);
  found.project.updatedAt = new Date().toISOString();
  saveState();
  closePaymentModal();
  go('package',{projectId:found.project.id});
  toast('Payment recorded using ' + method + '.');
}

  if(p.applications.some(a=>a.status==='On hold')) return 'On hold';
  if(p.applications.every(a=>a.status==='Completed')) return 'Completed';

  if(p.applications.some(a=>a.status==='Pending approval')) return 'Pending approval';

function dynamicFieldHtml(field, value=''){
  const cls = field.layout === 'Full width' ? 'field full' : 'field';
  const required = field.required ? 'required' : '';
  if(field.type === 'Long text') return `<div class="${cls}"><label>${esc(field.label)}</label><textarea data-field-id="${field.id}" ${required}>${esc(value)}</textarea></div>`;
  if(field.type === 'Dropdown') return `<div class="${cls}"><label>${esc(field.label)}</label><select data-field-id="${field.id}" ${required}>${String(field.options||'').split(',').map(o=>`<option ${value===o.trim()?'selected':''}>${esc(o.trim())}</option>`).join('')}</select></div>`;
  if(field.type === 'Yes/No') return `<div class="${cls}"><label>${esc(field.label)}</label><select data-field-id="${field.id}" ${required}><option ${value==='Yes'?'selected':''}>Yes</option><option ${value==='No'?'selected':''}>No</option></select></div>`;
  const map = {Date:'date', Time:'time', Email:'email', Phone:'tel', Number:'number', Text:'text', 'File upload':'file'};
  return `<div class="${cls}"><label>${esc(field.label)}</label><input data-field-id="${field.id}" type="${map[field.type]||'text'}" value="${field.type==='File upload'?'':esc(value)}" ${required} /></div>`;
}
function formInput(label,id,value='',full=false){ return `<div class="field ${full?'full':''}"><label for="${id}">${label}</label><input id="${id}" value="${esc(value)}" /></div>`; }
function saveApplicationDraft(appId){
  const found = findApp(appId); const project = found.project; const appItem = found.app;
  if(!appItem) return;
  const beforeCommon = {...(appItem.common || {})};
  const beforeForm = {...(appItem.formData || {})};
  appItem.common = {
    applicantName: byId('f_applicantName').value.trim(), email: byId('f_email').value.trim(),
    phone: byId('f_phone').value.trim(), mailingAddress: byId('f_mailingAddress').value.trim(),
    taxLot: byId('f_taxLot')?.value.trim() || appItem.common.taxLot || ''
  };
  document.querySelectorAll('[data-field-id]').forEach(el => {
    if(el.type === 'file') appItem.formData[el.dataset.fieldId] = el.files?.[0]?.name || appItem.formData[el.dataset.fieldId] || '';
    else appItem.formData[el.dataset.fieldId] = el.value;
  });
  if(isStaffRole()){
    compareAndAudit(project, appItem, beforeCommon, appItem.common, 'Common information');
    compareAndAudit(project, appItem, beforeForm, appItem.formData, 'Application field');
    const note = byId('processorComment')?.value.trim() || '';
    if(note) addProjectCommunication(project, note, appItem);
  }
  setPackageFormStatus(project, appItem, appItem.status === 'Completed' ? 'Completed' : 'Submitted', 'Draft saved by user or staff');
  project.updatedAt = new Date().toISOString();
  saveState(); toast('Application draft saved.');
}
function submitApplication(appId){
  saveApplicationDraft(appId);
  const found = findApp(appId); const project = found.project; const appItem = found.app;
  setPackageFormStatus(project, appItem, 'Pending approval', 'Submitted to department');
  if(appItem.approvalMode === 'Parallel') appItem.approvalSteps.forEach(s => s.status='Processing');
  else appItem.approvalSteps.forEach((s,i) => s.status = i===0 ? 'Processing' : 'Pending approval');
  evaluatePaymentDue(appItem, 'submission');
  if(appItem.status === 'Pending payment') setPackageFormStatus(project, appItem, 'Pending payment', 'Payment required at submission');
  appItem.submittedAt = new Date().toISOString();
  project.updatedAt = appItem.submittedAt;
  addAudit(project, appItem, 'Application submitted', `Submitted to ${appItem.department}`);
  addNotification(project, `${appItem.name} was submitted to ${appItem.department}.`, appItem.id);
  saveState(); toast(`Submitted to ${appItem.department}.`); go('package',{projectId:project.id});
}
function saveApplicationStatus(appId){
  const found=findApp(appId); if(!found.app) return;
  const before = found.app.status;
  setPackageFormStatus(found.project, found.app, byId('appStatus').value, 'Status updated by processor');
  evaluatePaymentDue(found.app, 'statusUpdate');
  if(found.app.status === 'Pending payment') setPackageFormStatus(found.project, found.app, 'Pending payment', 'Payment required upon issued');
  if(before !== found.app.status){
    addAudit(found.project, found.app, 'Status updated', `Status changed from "${before}" to "${found.app.status}"`);
    addNotification(found.project, `${found.app.name} status changed to ${found.app.status}.`, found.app.id);
  }
  found.project.updatedAt=new Date().toISOString();
  saveState(); render(); toast('Application status updated.');
}
function updateStepStatus(appId, stepId, status){
  const found=findApp(appId); const step=found.app.approvalSteps.find(s=>s.id===stepId); if(step) step.status=status;
  if(found.app.approvalSteps.every(s=>s.status==='Completed')){
    setPackageFormStatus(found.project, found.app, 'Processing', 'All approval steps completed');
    evaluatePaymentDue(found.app, 'approval');
    if(found.app.status !== 'Pending payment') setPackageFormStatus(found.project, found.app, found.app.paymentTiming === 'Upon issued' ? 'Processing' : 'Completed', 'Approval flow completed');
  }
  else if(found.app.approvalSteps.some(s=>s.status==='On hold')) setPackageFormStatus(found.project, found.app, 'On hold', 'Approval step placed on hold');
  else setPackageFormStatus(found.project, found.app, 'Processing', 'Approval step updated');
  addAudit(found.project, found.app, 'Approval step updated', `${step?.department || 'Department'} changed to ${status}`);
  addNotification(found.project, `${found.app.name} approval step updated: ${step?.department || 'Department'} is ${status}.`, found.app.id);
  found.project.updatedAt=new Date().toISOString(); saveState(); toast('Approval step updated.');
}

  });
  const out = byId('resourceResults');

function uploadZoneIcon(zoneId, input){
  const file = input.files && input.files[0];
  if(!file) return;
  const ok = ['image/png','image/jpeg','image/svg+xml'].includes(file.type) || /\.(png|jpe?g|svg)$/i.test(file.name);
  if(!ok){
    toast('Please upload a PNG, JPG, JPEG, or SVG icon file.');
    input.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = function(event){
    const cfg = ensureAdminConfig();
    const zone = cfg.zones.find(z=>z.id===zoneId);
    if(!zone) return;
    zone.iconImageDataUrl = event.target.result;
    zone.iconFileName = file.name;
    logSystemAudit('Zone icon uploaded', `${zone.menuLabel || zone.id}: ${file.name}`);
    saveState();
    go('admin',{tab:'zones',zoneId});
  };
  reader.readAsDataURL(file);
}

  if(!zone) return;
  zone.iconImageDataUrl = '';

}

function actionIconSvg(type){
  if(type === 'plus'){
    return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`;
  }
  if(type === 'edit'){
    return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l11-11a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>`;
  }
  if(type === 'trash'){
    return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>`;
  }
  return '';
}
function iconActionButton(type, label, onclick, danger=false){
  return `<button type="button" class="icon-btn ${danger?'danger':''}" title="${esc(label)}" aria-label="${esc(label)}" onclick="${onclick}">${actionIconSvg(type)}</button>`;
}

function parseDateOnly(value){
  if(!value) return null;
  const d = new Date(value + 'T00:00:00');
  return isNaN(d.getTime()) ? null : d;
}
function daysUntilDate(value){
  const d = parseDateOnly(value);
  if(!d) return null;
  const today = new Date();
  const todayMid = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  return Math.ceil((d - todayMid) / 86400000);
}
function addDaysIso(days){
  const d = new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString();
}
function nextWeeklyCheckFromNow(){
  return addDaysIso(7);
}
function licenseStatusClass(status){
  if(status === 'Valid') return 'valid';
  if(status === 'Expired' || status === 'Invalid') return 'expired';
  if(status === 'Expiring soon') return 'warning';
  return '';
}
function computeLicenseStatus(license){
  if(!license.key) return {status:'Not configured', message:'Enter a license key to enable validation.', days:null};
  const days = daysUntilDate(license.expirationDate);
  if(days === null) return {status:'Invalid', message:'Expiration date is required for this local prototype.', days:null};
  if(days < 0) return {status:'Expired', message:`License expired ${Math.abs(days)} day(s) ago.`, days};
  if(days <= 30) return {status:'Expiring soon', message:`License expires in ${days} day(s).`, days};
  return {status:'Valid', message:`License is valid and expires in ${days} day(s).`, days};
}
function refreshLicenseReminders(license){
  const days = daysUntilDate(license.expirationDate);
  const thresholds = [90,30,2];
  license.reminders = license.reminders || [];
  thresholds.forEach(daysBefore => {
    const existing = license.reminders.find(r => r.daysBefore === daysBefore);
    const reminderDate = parseDateOnly(license.expirationDate);
    if(reminderDate) reminderDate.setDate(reminderDate.getDate() - daysBefore);
    const due = days !== null && days <= daysBefore && days >= 0;
    if(existing){
      existing.date = reminderDate ? reminderDate.toISOString().slice(0,10) : '';
      if(due && !existing.sentAt){
        existing.sentAt = new Date().toISOString();
        existing.message = `${daysBefore}-day admin reminder: PermitFinder Pro license expires on ${license.expirationDate}.`;
      }
    } else {
      license.reminders.push({
        id:uid('LICREM'),
        daysBefore,
        date: reminderDate ? reminderDate.toISOString().slice(0,10) : '',
        sentAt: due ? new Date().toISOString() : '',
        message: due ? `${daysBefore}-day admin reminder: PermitFinder Pro license expires on ${license.expirationDate}.` : `${daysBefore}-day admin reminder scheduled.`
      });
    }
  });
  license.reminders.sort((a,b)=>b.daysBefore-a.daysBefore);
}
function validateLicenseFromServer(manual=false){
  const cfg = ensureAdminConfig();
  const license = cfg.license;
  const before = JSON.stringify(license);
  const result = computeLicenseStatus(license);
  license.status = result.status;
  license.lastServerMessage = `${result.message} Weekly cloud validation endpoint: ${license.serverUrl || 'https://permitfinderpro.com/license-key-server/validate'}`;
  license.lastCheckAt = new Date().toISOString();
  license.nextCheckAt = nextWeeklyCheckFromNow();
  refreshLicenseReminders(license);
  logSystemAudit(manual ? 'License validation checked manually' : 'License validation checked weekly', `${before} -> ${JSON.stringify(license)}`);
  saveState();
  if(manual) { render(); toast('License validation check complete.'); }
}
function maybeRunWeeklyLicenseCheck(){
  const cfg = ensureAdminConfig();
  const license = cfg.license;
  if(!license || !license.key) return;
  const last = license.lastCheckAt ? new Date(license.lastCheckAt) : null;
  const now = new Date();
  const stale = !last || (now - last) >= 7 * 86400000;
  if(stale){
    validateLicenseFromServer(false);
  } else {
    refreshLicenseReminders(license);
  }
}

function deleteQuestion(questionId){
  const cfg=ensureAdminConfig();
  const q = cfg.questions.find(item=>item.id===questionId);
  if(!q) return;
  const dependentZones = cfg.zones.filter(z=>z.startQuestionId===questionId);
  const dependentAnswers = [];
  cfg.questions.forEach(question => (question.answers || []).forEach(ans => {
    if(ans.resultType === 'nextQuestion' && ans.target === questionId) dependentAnswers.push({question, ans});
  }));
  const warning = dependentZones.length || dependentAnswers.length
    ? `\n\nThis question is referenced by ${dependentZones.length} zone start setting(s) and ${dependentAnswers.length} answer Result(s). Deleting it will clear or re-route those references.`
    : '';
  if(!confirm(`Delete this question?${warning}`)) return;

  const deletedZoneId = q.zoneId;
  cfg.questions = cfg.questions.filter(item=>item.id!==questionId);
  cfg.questions.forEach((question,i)=>{ if(!question.order) question.order=i+1; });

  dependentAnswers.forEach(({ans}) => {
    ans.resultType = 'statement';
    ans.target = '';
    ans.moreInfo = (ans.moreInfo ? ans.moreInfo + '\n\n' : '') + 'Prior next-question Result was cleared because the referenced question was deleted.';
  });

  dependentZones.forEach(zone => {
    const replacement = cfg.questions.filter(item=>item.zoneId===zone.id).sort((a,b)=>(a.order||0)-(b.order||0))[0];
    zone.startQuestionId = replacement ? replacement.id : '';
  });

  cfg.questions.filter(item=>item.zoneId===deletedZoneId).sort((a,b)=>(a.order||0)-(b.order||0)).forEach((item,i)=>item.order=i+1);
  logSystemAudit('Question deleted with referential integrity cleanup', `${questionId}: ${q.text}`);
  saveState();
  const context = byId('questionEditorContext')?.value || route.params.tab || 'questions';
  if(context === 'configureZones') go('admin',{tab:'configureZones',zoneId:deletedZoneId});
  else go('admin',{tab:'questions'});
}

function moveQuestionToZone(questionId, zoneId){
  const cfg = ensureAdminConfig();
  const q = cfg.questions.find(x=>x.id===questionId);
  if(!q) return;
  const before = JSON.stringify(q);
  q.zoneId = zoneId;
  const zoneQuestions = cfg.questions.filter(x=>x.zoneId===zoneId && x.id!==questionId);
  q.order = zoneQuestions.length + 1;
  const zone = cfg.zones.find(z=>z.id===zoneId);
  if(zone && !zone.startQuestionId) zone.startQuestionId = q.id;
  logSystemAudit('Question added to zone flow', `${before} -> ${JSON.stringify(q)}`);
  saveState();
  go('admin',{tab:'configureZones',zoneId,questionId});
}
function newZoneFlowQuestion(zoneId){
  const cfg=ensureAdminConfig();
  if(!zoneId){ toast('Select a zone first.'); return; }
  const q={id:uid('Q'),order:zoneFlowQuestions(zoneId).length+1,zoneId,text:'New question for this zone',moreInfo:'',showInfoIcon:false,answers:[]};
  cfg.questions.push(q);
  const zone=cfg.zones.find(z=>z.id===zoneId);
  if(zone && !zone.startQuestionId) zone.startQuestionId=q.id;
  logSystemAudit('Question created in zone flow', `${zoneId}: ${q.id}`);
  saveState();
  go('admin',{tab:'configureZones',zoneId,questionId:q.id});
}
function setupZoneFlowDrag(){
  const flow = byId('zoneFlowQuestionList');
  const flowLeft = byId('zoneFlowQuestionListLeft');
  const available = byId('availableQuestionList');
  let dragId = null;
  document.querySelectorAll('[data-kind="zoneFlowQuestion"],[data-kind="availableZoneQuestion"]').forEach(row => {
    row.addEventListener('dragstart',()=>{dragId=row.dataset.id; row.classList.add('dragging');});
    row.addEventListener('dragend',()=>row.classList.remove('dragging'));
  });
  if(flowLeft){
    flowLeft.addEventListener('dragover',e=>{e.preventDefault(); flowLeft.classList.add('active');});
    flowLeft.addEventListener('dragleave',()=>flowLeft.classList.remove('active'));
    flowLeft.addEventListener('drop',e=>{
      e.preventDefault(); flowLeft.classList.remove('active');
      const zoneId = flowLeft.dataset.zoneId;
      if(dragId && zoneId){ const dragged = ensureAdminConfig().questions.find(q=>q.id===dragId); if(dragged && dragged.zoneId !== zoneId) moveQuestionToZone(dragId, zoneId); }
    });
  }
  if(flow){
    flow.addEventListener('dragover',e=>{e.preventDefault(); flow.classList.add('active');});
    flow.addEventListener('dragleave',()=>flow.classList.remove('active'));
    flow.addEventListener('drop',e=>{
      e.preventDefault(); flow.classList.remove('active');
      const zoneId = flow.dataset.zoneId;
      if(!dragId || !zoneId) return;
      const targetRow = e.target.closest('[data-kind="zoneFlowQuestion"]');
      const targetId = targetRow ? targetRow.dataset.id : '';
      const dragged = ensureAdminConfig().questions.find(q=>q.id===dragId);
      if(!dragged) return;
      if(dragged.zoneId !== zoneId){
        moveQuestionToZone(dragId, zoneId);
      } else if(targetId && targetId !== dragId){
        reorderZoneFlowQuestion(zoneId, dragId, targetId);
      }
    });
    flow.querySelectorAll('[data-kind="zoneFlowQuestion"]').forEach(row=>{
      row.addEventListener('dragover',e=>{e.preventDefault(); row.classList.add('drop-hint');});
      row.addEventListener('dragleave',()=>row.classList.remove('drop-hint'));
      row.addEventListener('drop',e=>{
        e.preventDefault(); e.stopPropagation(); row.classList.remove('drop-hint');
        const zoneId = flow.dataset.zoneId;
        if(dragId && row.dataset.id && dragId!==row.dataset.id) reorderZoneFlowQuestion(zoneId, dragId, row.dataset.id);
      });
    });
  }
}
function reorderZoneFlowQuestion(zoneId, fromId, toId){
  const cfg=ensureAdminConfig();
  const flow=cfg.questions.filter(q=>q.zoneId===zoneId).sort((a,b)=>(a.order||0)-(b.order||0));
  const from=flow.findIndex(q=>q.id===fromId), to=flow.findIndex(q=>q.id===toId);
  if(from<0||to<0) return;
  const [item]=flow.splice(from,1); flow.splice(to,0,item);
  flow.forEach((q,i)=>q.order=i+1);
  const zone=cfg.zones.find(z=>z.id===zoneId);
  if(zone && flow[0]) zone.startQuestionId = flow[0].id;
  logSystemAudit('Zone flow reordered', `${fromId} moved in ${zoneId}`);
  saveState();
  go('admin',{tab:'configureZones',zoneId,questionId:fromId});
}

function importPropertyCsv(){
  const text = byId('csvInput').value.trim();
  if(!text){ toast('Paste CSV rows first.'); return; }
  const rows = parseCsv(text);
  if(!rows.length){ toast('No valid CSV rows found.'); return; }
  state.propertyLookup = rows.map(r => ({
    taxLot:r.taxLot || r.taxlot || r.TaxLot || r['tax lot'] || '',
    address:r.address || r.Address || '',
    floodplain:r.floodplain || r.Floodplain || '',
    permittedUse:r.permittedUse || r['permitted use'] || r.PermittedUse || '',
    history:[]
  })).filter(r=>r.taxLot);
  saveState(); toast(`Imported ${state.propertyLookup.length} property lookup rows.`); render();
}
function parseCsv(text){
  const lines=text.split(/\r?\n/).filter(Boolean); if(lines.length<2) return [];
  const headers=splitCsvLine(lines[0]).map(h=>h.trim());
  return lines.slice(1).map(line=>{ const vals=splitCsvLine(line); const obj={}; headers.forEach((h,i)=>obj[h]=vals[i]||''); return obj; });
}
function splitCsvLine(line){
  const out=[]; let cur='', q=false;
  for(let i=0;i<line.length;i++){ const ch=line[i]; if(ch==='"'){q=!q;continue;} if(ch===','&&!q){out.push(cur.trim());cur='';continue;} cur+=ch; }
  out.push(cur.trim()); return out;
}
function downloadPropertyCsv(){
  const rows=['taxLot,address,floodplain,permittedUse', ...DEFAULT_PROPERTY_LOOKUP.map(r=>`${r.taxLot},"${r.address}",${r.floodplain},"${r.permittedUse}"`)];
  downloadText('property_lookup_sample.csv', rows.join('\n'), 'text/csv');
}

function allApplicationItems(){
  return state.projects.flatMap(p => (p.applications || []).map(a => ({project:p, app:a})));
}
function departmentsForApps(items=allApplicationItems()){
  return [...new Set(items.map(x => x.app.department).filter(Boolean))].sort();
}
function processorForApp(appItem){
  const dept = appItem.department || '';
  const choices = PROCESSOR_DIRECTORY.filter(p => dept.includes(p.department) || p.department.includes(dept) || dept.includes(p.department.split(' / ')[0]));
  if(!choices.length) return PROCESSOR_DIRECTORY[Math.abs(hashCode(appItem.id)) % PROCESSOR_DIRECTORY.length];
  return choices[Math.abs(hashCode(appItem.id)) % choices.length];
}
function hashCode(str){
  let h=0; for(let i=0;i<String(str).length;i++){ h=((h<<5)-h)+String(str).charCodeAt(i); h|=0; }
  return h;
}
function appMatchesMetric(x, metric){
  const app = x.app;
  if(!metric || metric === 'all') return true;
  if(metric === 'payment') return app.status === 'Pending payment' || isPaymentDue(app);
  if(metric === 'overdue') return app.status === 'On hold' || app.status === 'Pending approval';
  if(metric === 'completed') return app.status === 'Completed';
  if(metric === 'processing') return app.status === 'Processing';
  if(metric === 'pending') return app.status === 'Pending approval' || app.status === 'Submitted';
  return app.status === metric;
}
function metricDefinitions(items){
  return [
    {id:'all', label:'All applications', count:items.length},
    {id:'pending', label:'New / pending', count:items.filter(x=>appMatchesMetric(x,'pending')).length},
    {id:'processing', label:'Processing', count:items.filter(x=>appMatchesMetric(x,'processing')).length},
    {id:'payment', label:'Pending payment', count:items.filter(x=>appMatchesMetric(x,'payment')).length},
    {id:'overdue', label:'Needs attention', count:items.filter(x=>appMatchesMetric(x,'overdue')).length},
    {id:'completed', label:'Completed', count:items.filter(x=>appMatchesMetric(x,'completed')).length}
  ];
}
function metricCardsHtml(items, activeMetric, routeName, extraParams={}){

}

function dateFromValue(value){
  if(!value) return null;
  const d = new Date(value);
  return isNaN(d.getTime()) ? null : d;
}
function appStartDate(project, appItem){
  const history = appItem.statusHistory || [];
  const createdHistory = history[history.length - 1]?.at || history[0]?.at;
  return dateFromValue(appItem.submittedAt) || dateFromValue(createdHistory) || dateFromValue(project.createdAt) || new Date();
}
function appCompletedDate(appItem){
  if(appItem.status !== 'Completed') return null;
  const history = appItem.statusHistory || [];
  const completed = history.find(h => h.to === 'Completed') || history.find(h => h.to === appItem.status);
  return dateFromValue(completed?.at) || dateFromValue(appItem.updatedAt);
}
function daysBetweenDates(start, end){
  if(!start || !end) return 0;
  const startMid = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  const endMid = new Date(end.getFullYear(), end.getMonth(), end.getDate());
  return Math.max(0, Math.ceil((endMid - startMid) / 86400000));
}
function processingDaysForItem(item){
  const start = appStartDate(item.project, item.app);
  const end = appCompletedDate(item.app) || new Date();
  return daysBetweenDates(start, end);
}
function averageDays(items){
  if(!items || !items.length) return 0;
  const total = items.reduce((sum,item)=>sum + processingDaysForItem(item), 0);
  return Math.round((total / items.length) * 10) / 10;
}
function statusLabelForAnalytics(status){
  return status || 'Submitted';
}
function averageDaysByStatus(items){
  const groups = {};
  (items || []).forEach(item => {
    const key = statusLabelForAnalytics(item.app.status);
    groups[key] = groups[key] || [];
    groups[key].push(item);
  });
  return Object.keys(groups).sort().map(status => ({status, count:groups[status].length, avg:averageDays(groups[status])}));
}
function averageDaysPanel(items, title='Average days to process'){

  return `<div class="panel" style="margin-top:0">

    <div class="fee-total"><span>Overall average</span><strong>${averageDays(items)} day(s)</strong></div>
    <div class="avg-grid">
      ${byStatus.length ? byStatus.map(row=>`<div class="avg-card"><span>${esc(row.status)} · ${row.count}</span><strong>${row.avg}</strong><span>avg day(s)</span></div>`).join('') : '<p class="small">No applications available.</p>'}
    </div>
  </div>`;
}
function openOrders(items){
  return (items || [])
    .filter(item => item.app.status !== 'Completed')
    .map(item => ({...item, daysOpen:processingDaysForItem(item)}))
    .sort((a,b)=>b.daysOpen - a.daysOpen || a.app.name.localeCompare(b.app.name));
}

  const orders = openOrders(items);

function applicationTypeForItem(item){
  return item.app.name || item.app.catalogId || 'Application';
}
function averageByGroup(items, groupFn){
  const groups = {};
  (items || []).forEach(item => {
    const key = groupFn(item) || 'Unassigned';
    groups[key] = groups[key] || [];
    groups[key].push(item);
  });
  return Object.keys(groups).sort().map(label => ({
    label,
    count:groups[label].length,
    avg:averageDays(groups[label]),
    items:groups[label]
  }));
}

  return `<div class="panel">

      <div><h2>Average days to process by department</h2><p>Click a department to drill into application type and person processing cycle time.</p></div>
      ${selectedDept ? `<button class="btn secondary" onclick="go('director',{metric:'${esc(metric)}'})">Clear department drill-down</button>` : ''}

}

  return `<div class="panel" style="margin-top:0">

    <p class="small">Click a row to filter the application list and show days in cycle for that group.</p>
    ${rows.length ? rows.map(row=>`<button class="director-drill-row ${selectedValue===row.label?'active':''}" onclick="go('director',{department:'${esc(dept)}',metric:'${esc(metric)}',drillKind:'${kind}',drillValue:'${esc(row.label)}'})">

      <span class="days-open">${row.avg}<span>avg days</span></span>

  </div>`;

function directorDepartmentDrilldowns(deptApps, dept, metric, drillKind='', drillValue=''){
  if(!dept) return '';
  const typeRows = averageByGroup(deptApps, applicationTypeForItem).sort((a,b)=>b.avg-a.avg || a.label.localeCompare(b.label));
  const processorRows = averageByGroup(deptApps, item => processorForApp(item.app).name).sort((a,b)=>b.avg-a.avg || a.label.localeCompare(b.label));
  return `<div class="director-drill-grid">
    ${directorDrillPanel('Days in cycle by application type', typeRows, 'type', drillKind==='type' ? drillValue : '', dept, metric)}
    ${directorDrillPanel('Days in cycle by person processing', processorRows, 'processor', drillKind==='processor' ? drillValue : '', dept, metric)}
  </div>`;
}
function filterDirectorDrill(items, drillKind='', drillValue=''){
  if(!drillKind || !drillValue) return items;
  if(drillKind === 'type') return items.filter(item => applicationTypeForItem(item) === drillValue);
  if(drillKind === 'processor') return items.filter(item => processorForApp(item.app).name === drillValue);
  return items;
}
function directorDrillLabel(drillKind='', drillValue=''){
  if(!drillKind || !drillValue) return '';
  return `${drillKind === 'type' ? 'Application type' : 'Person processing'}: ${drillValue}`;
}

function openHistoricalPdf(taxLot, recordId){
  const property = state.propertyLookup.find(r=>r.taxLot===taxLot);
  const hist = property?.history?.find(h=>h.id===recordId);
  if(!property || !hist){ toast('Historical record not found.'); return; }
  const lines = [
    'City of Ann Arbor - Permitfinder Pro',
    'Historical Permit / Application Record',
    '',
    'Tax lot: ' + property.taxLot,
    'Address: ' + property.address,
    'Record: ' + hist.title,
    'Record ID: ' + hist.id,
    'Year: ' + hist.year,
    'Department: ' + hist.department,
    'Status: ' + hist.status,
    '',
    'Floodplain: ' + property.floodplain,
    'Permitted use: ' + property.permittedUse
  ];
  const blob = makeSimplePdf(hist.title, lines);
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}
function makeSimplePdf(title, lines){
  const escPdf = s => String(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
  const text = lines.map((l,i)=>`BT /F1 12 Tf 72 ${740 - i*18} Td (${escPdf(l)}) Tj ET`).join('\n');
  const objs = [
    '1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj\n',
    '2 0 obj << /Type /Pages /Kids [3 0 R] /Count 1 >> endobj\n',
    '3 0 obj << /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >> endobj\n',
    '4 0 obj << /Type /Font /Subtype /Type1 /BaseFont /Helvetica >> endobj\n',
    `5 0 obj << /Length ${text.length} >> stream\n${text}\nendstream endobj\n`
  ];
  let pdf = '%PDF-1.4\n';
  const offsets = [0];
  objs.forEach(o => { offsets.push(pdf.length); pdf += o; });
  const xref = pdf.length;
  pdf += 'xref\n0 6\n0000000000 65535 f \n';
  for(let i=1;i<=5;i++) pdf += String(offsets[i]).padStart(10,'0') + ' 00000 n \n';
  pdf += `trailer << /Size 6 /Root 1 0 R /Title (${escPdf(title)}) >>\nstartxref\n${xref}\n%%EOF`;
  return new Blob([pdf], {type:'application/pdf'});
}

function downloadText(filename, text, type='text/plain'){
  const blob = new Blob([text], {type}); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url);
}
